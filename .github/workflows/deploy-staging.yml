name: Isolated frontend integration build
on:
  workflow_dispatch:
    inputs:
      mode:
        type: choice
        default: compose
        options: [compose]
permissions:
  contents: read
jobs:
  verify-build:
    runs-on: smarteat-runner
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: 2ef78f2541f5dbab03b25406047ca41301f64ce4
      - name: Verify source and generate frontend in an ephemeral Docker container
        shell: bash
        run: |
          set -eu
          git diff --exit-code 2ef78f2541f5dbab03b25406047ca41301f64ce4 HEAD -- . ':!.github/workflows/deploy-staging.yml'
          echo 'INTEGRATION_SOURCE=2ef78f2541f5dbab03b25406047ca41301f64ce4'
          docker run --rm --mount "type=bind,src=$GITHUB_WORKSPACE,dst=/source,readonly" -e ENV=staging -e NODE_ENV=production node:18-bullseye-slim sh -c '
            set -eu
            mkdir /work
            cp -a /source/. /work/
            cd /work
            npm ci --include=dev --no-audit --no-fund
            npm run generate
            test -s dist/index.html
            sha256sum dist/index.html
            echo INTEGRATION_FRONTEND_BUILD=passed
          '
